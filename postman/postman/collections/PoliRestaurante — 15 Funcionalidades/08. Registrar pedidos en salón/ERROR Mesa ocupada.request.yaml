$kind: http-request
url: "{{baseUrl}}/api/pedidos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"tipo":"SALON","id_mesa":{{mesaId}},"id_mesero":{{userId}}}'
scripts:
  - type: afterResponse
    code: pm.test('Estado 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 5000
