$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{deliveryOrderId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"observaciones":"Domicilio actualizado"}'
scripts:
  - type: afterResponse
    code: pm.test('Estado 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
