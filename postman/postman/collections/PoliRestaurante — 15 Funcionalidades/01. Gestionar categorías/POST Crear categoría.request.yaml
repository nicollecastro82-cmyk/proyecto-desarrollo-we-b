$kind: http-request
url: "{{baseUrl}}/api/categorias"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"nombre":"{{categoryName}}","activo":true}'
scripts:
  - type: beforeRequest
    code: pm.environment.set('categoryName', 'Categoria Principal ' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.environment.set('categoryId', pm.response.json().datos.id_categoria);
    language: text/javascript
order: 2000
