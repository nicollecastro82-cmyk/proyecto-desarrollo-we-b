$kind: http-request
url: "{{baseUrl}}/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"nombre":"{{productCrudName}}","precio":25000,"id_categoria":{{productCategoryId}}}'
scripts:
  - type: afterResponse
    code: pm.test('Estado 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 6000
