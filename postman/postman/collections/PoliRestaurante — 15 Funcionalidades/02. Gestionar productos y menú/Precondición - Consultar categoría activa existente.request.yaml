$kind: http-request
url: "{{baseUrl}}/api/categorias/{{productCategoryId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('Categoría activa', () => pm.expect(pm.response.json().datos.activo).to.eql(true));
    language: text/javascript
order: 1000
