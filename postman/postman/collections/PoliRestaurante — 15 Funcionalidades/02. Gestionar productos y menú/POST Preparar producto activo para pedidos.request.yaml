$kind: http-request
url: "{{baseUrl}}/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"nombre":"{{productName}}","descripcion":"Producto para pedidos","precio":"12500.00","id_categoria":{{productCategoryId}}}'
scripts:
  - type: beforeRequest
    code: pm.environment.set('productName', 'Producto Pedidos ' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.environment.set('productId', pm.response.json().id_producto);
    language: text/javascript
order: 9000
