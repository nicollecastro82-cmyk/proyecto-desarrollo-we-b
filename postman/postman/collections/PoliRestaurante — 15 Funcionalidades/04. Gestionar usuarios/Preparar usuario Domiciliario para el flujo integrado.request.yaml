$kind: http-request
url: "{{baseUrl}}/api/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id_tipo_usuario":{{courierRoleId}},"nombre":"Domiciliario Postman","usuario_login":"{{courierLogin}}","contrasena":"ClaveSegura123","correo":"{{courierEmail}}"}'
scripts:
  - type: beforeRequest
    code: |-
      const run=Date.now();
      pm.environment.set('courierLogin','courier_postman_'+run);
      pm.environment.set('courierEmail','courier_postman_'+run+'@example.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      if(pm.response.code===201) pm.environment.set('courierId',pm.response.json().datos.id_usuario);
    language: text/javascript
order: 12000
