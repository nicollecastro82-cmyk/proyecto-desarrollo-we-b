$kind: http-request
url: "{{baseUrl}}/api/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id_tipo_usuario":{{employeeRoleId}},"nombre":"Usuario CRUD","usuario_login":"{{userCrudLogin}}","contrasena":"ClaveSegura123","correo":"{{userCrudEmail}}"}'
scripts:
  - type: beforeRequest
    code: |-
      const run=Date.now();
      pm.environment.set('userCrudLogin','usuario_crud_'+run);
      pm.environment.set('userCrudEmail','usuario_crud_'+run+'@example.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      if(pm.response.code===201) pm.environment.set('userCrudId',pm.response.json().datos.id_usuario);
    language: text/javascript
order: 2000
