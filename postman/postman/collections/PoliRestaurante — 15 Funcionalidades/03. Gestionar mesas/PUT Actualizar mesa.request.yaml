$kind: http-request
url: "{{baseUrl}}/mesas/{{mesaCrudId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"numero_mesa":{{mesaCrudUpdatedNumber}}}'
scripts:
  - type: afterResponse
    code: pm.test('Estado 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
