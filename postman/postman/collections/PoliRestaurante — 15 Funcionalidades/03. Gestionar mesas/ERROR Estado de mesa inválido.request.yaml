$kind: http-request
url: "{{baseUrl}}/mesas/{{mesaCrudId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"estado":"RESERVADA"}'
scripts:
  - type: afterResponse
    code: pm.test('Estado 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
