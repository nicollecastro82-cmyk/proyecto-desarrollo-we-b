$kind: http-request
url: "{{baseUrl}}/mesas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"numero_mesa":{{mesaNumber}}}'
scripts:
  - type: beforeRequest
    code: pm.environment.set('mesaNumber', 500000 + Math.floor(Math.random() * 300000));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.environment.set('mesaId', pm.response.json().id_mesa);
    language: text/javascript
order: 7000
