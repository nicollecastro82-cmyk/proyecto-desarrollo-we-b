$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{salonOrderId}}/detalles"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id_producto":{{productId}},"cantidad":2}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      if(pm.response.code===201){const r=pm.response.json();pm.environment.set('detailId',r.datos.id_detalle);pm.environment.set('salonOrderTotal',r.valor_total);}
    language: text/javascript
order: 7000
