$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{salonOrderId}}/detalles"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id_producto":{{productId}},"cantidad":1}'
scripts:
  - type: afterResponse
    code: pm.test('Estado 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 8000
