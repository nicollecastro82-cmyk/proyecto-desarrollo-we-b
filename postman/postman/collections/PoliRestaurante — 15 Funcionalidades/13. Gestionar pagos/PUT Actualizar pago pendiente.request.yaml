$kind: http-request
url: "{{baseUrl}}/api/pagos/{{paymentId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"metodo":"EFECTIVO","valor":{{salonOrderTotal}}}'
scripts:
  - type: afterResponse
    code: pm.test('Estado 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
