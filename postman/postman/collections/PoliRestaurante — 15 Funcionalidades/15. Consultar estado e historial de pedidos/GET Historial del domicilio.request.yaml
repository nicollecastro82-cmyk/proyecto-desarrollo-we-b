$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{deliveryOrderId}}/historial"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('Incluye estado ENTREGADO',()=>pm.expect(pm.response.json().datos.map(x=>x.estado)).to.include('ENTREGADO'));
    language: text/javascript
order: 4000
