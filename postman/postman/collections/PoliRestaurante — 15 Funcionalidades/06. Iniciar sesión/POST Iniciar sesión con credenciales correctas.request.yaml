$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"usuario_login":"{{employeeLogin}}","contrasena":"ClaveSegura123"}'
scripts:
  - type: afterResponse
    code: pm.test('Estado 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
