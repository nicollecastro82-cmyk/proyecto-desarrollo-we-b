$kind: http-request
url: "{{baseUrl}}/api/usuarios/{{userId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"activo":false}'
scripts:
  - type: afterResponse
    code: pm.test('Estado 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
