$kind: http-request
url: "{{baseUrl}}/api/horarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id_usuario":{{userId}},"fecha":"2099-10-24","hora_inicio":"08:00","hora_fin":"16:00","observacion":"Horario Postman"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      if(pm.response.code===201) pm.environment.set('scheduleId',pm.response.json().datos.id_horario);
    language: text/javascript
order: 1000
