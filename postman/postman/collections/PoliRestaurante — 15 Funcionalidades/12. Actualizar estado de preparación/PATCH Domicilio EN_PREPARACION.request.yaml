$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{deliveryOrderId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"estado":"EN_PREPARACION","id_usuario_cambio":{{kitchenId}}}'
scripts:
  - type: afterResponse
    code: pm.test('Estado 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
