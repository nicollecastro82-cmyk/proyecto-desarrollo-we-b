$kind: http-request
url: "{{baseUrl}}/mesas/{{mesaId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('ID correcto', () => pm.expect(pm.response.json().id_mesa).to.eql(Number(pm.environment.get('mesaId'))));
    language: text/javascript
order: 3000
