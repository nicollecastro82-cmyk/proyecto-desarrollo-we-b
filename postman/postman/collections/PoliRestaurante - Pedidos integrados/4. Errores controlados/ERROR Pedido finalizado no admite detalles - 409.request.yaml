$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{deliveryOrderId}}/detalles"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id_producto": {{productId}},
      "cantidad": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 409', () => pm.response.to.have.status(409));
      pm.test('Pedido no editable', () => pm.expect(pm.response.json().error.codigo).to.eql('ORDER_NOT_EDITABLE'));
    language: text/javascript
order: 2000
