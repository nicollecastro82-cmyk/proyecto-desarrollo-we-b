$kind: http-request
url: "{{baseUrl}}/api/usuarios?incluir_inactivos=true"
method: GET
queryParams:
  incluir_inactivos: "true"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('Variables de usuarios definidas', () => { ['userId','kitchenId','clientId','courierId'].forEach(k => pm.expect(pm.environment.get(k), k).to.not.be.empty); });
    language: text/javascript
order: 3000
