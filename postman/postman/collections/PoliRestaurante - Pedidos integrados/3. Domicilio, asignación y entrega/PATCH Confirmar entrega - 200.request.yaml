$kind: http-request
url: "{{baseUrl}}/api/entregas/{{deliveryId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "estado": "ENTREGADA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('Entrega finalizada', () => pm.expect(pm.response.json().datos.estado).to.eql('ENTREGADA'));
    language: text/javascript
order: 8000
