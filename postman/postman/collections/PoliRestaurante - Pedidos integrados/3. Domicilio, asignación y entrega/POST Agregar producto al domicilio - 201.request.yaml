$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{deliveryOrderId}}/detalles"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id_producto": {{productId}},
      "cantidad": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) { const r = pm.response.json(); pm.environment.set('deliveryDetailId', r.datos.id_detalle); pm.environment.set('orderTotal', r.valor_total); }
    language: text/javascript
order: 2000
