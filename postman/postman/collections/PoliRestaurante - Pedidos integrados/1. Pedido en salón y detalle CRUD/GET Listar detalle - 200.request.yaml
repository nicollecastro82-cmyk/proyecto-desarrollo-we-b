$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{salonOrderId}}/detalles"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('Contiene productos', () => pm.expect(pm.response.json().datos).to.not.be.empty);
    language: text/javascript
order: 5000
