$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{salonOrderId}}/detalles/{{detailId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('Total vuelve a cero', () => pm.expect(pm.response.json().valor_total).to.eql('0.00'));
    language: text/javascript
order: 8000
