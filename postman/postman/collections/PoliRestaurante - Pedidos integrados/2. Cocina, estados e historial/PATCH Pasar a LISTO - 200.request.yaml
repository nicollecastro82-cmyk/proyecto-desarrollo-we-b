$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{salonOrderId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "estado": "LISTO",
      "id_usuario_cambio": {{kitchenId}}
    }
scripts:
  - type: afterResponse
    code: pm.test('Estado 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
