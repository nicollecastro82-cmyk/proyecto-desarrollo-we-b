$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{salonOrderId}}/historial"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('Registra al menos cuatro estados', () => pm.expect(pm.response.json().datos.length).to.be.at.least(4));
    language: text/javascript
order: 6000
