$kind: http-request
url: "{{baseUrl}}/api/pedidos/{{salonOrderId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "estado": "EN_PREPARACION",
      "id_usuario_cambio": {{clientId}}
    }
scripts:
  - type: afterResponse
    code: pm.test('Estado 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 2000
