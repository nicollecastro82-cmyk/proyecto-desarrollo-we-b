$kind: http-request
url: "{{baseUrl}}/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "{{productName}}",
      "descripcion": "Dato de prueba Postman",
      "precio": 25000,
      "id_categoria": {{productCategoryId}}
    }
scripts:
  - type: beforeRequest
    code: pm.environment.set('productName', 'Producto Integracion ' + Date.now());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      pm.test('Producto activo y disponible', () => { const p = pm.response.json(); pm.expect(p.activo).to.eql(true); pm.expect(p.disponible).to.eql(true); });
      if (pm.response.code === 201) pm.environment.set('productId', pm.response.json().id_producto);
    language: text/javascript
order: 2000
