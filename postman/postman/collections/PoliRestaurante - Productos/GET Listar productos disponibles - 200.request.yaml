$kind: http-request
url: "{{baseUrl}}/productos?id_categoria={{productCategoryId}}"
method: GET
queryParams:
  id_categoria: "{{productCategoryId}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('Respuesta es lista', () => pm.expect(pm.response.json()).to.be.an('array')); 
    language: text/javascript
order: 4000
