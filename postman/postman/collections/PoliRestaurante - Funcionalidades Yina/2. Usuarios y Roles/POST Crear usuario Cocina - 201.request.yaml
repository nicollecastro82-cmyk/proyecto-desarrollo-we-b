$kind: http-request
url: "{{baseUrl}}/api/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id_tipo_usuario": {{kitchenRoleId}},
      "nombre": "Cocina Postman",
      "usuario_login": "{{kitchenLogin}}",
      "contrasena": "ClaveSegura123",
      "correo": "{{kitchenEmail}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      const run = Date.now();
      pm.environment.set('kitchenLogin', 'cocina_' + run);
      pm.environment.set('kitchenEmail', 'cocina_' + run + '@example.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.environment.set('kitchenId', pm.response.json().datos.id_usuario);
    language: text/javascript
order: 6500
