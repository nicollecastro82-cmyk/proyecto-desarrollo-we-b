$kind: http-request
url: "{{baseUrl}}/api/usuarios/{{userId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id_tipo_usuario": {{employeeRoleId}},
      "nombre": "Empleado Actualizado",
      "usuario_login": "{{employeeLogin}}",
      "correo": "{{employeeEmail}}",
      "telefono": "3111234567",
      "activo": true
    }
scripts:
  - type: afterResponse
    code: pm.test('Estado 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000
