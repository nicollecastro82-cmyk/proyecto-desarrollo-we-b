$kind: http-request
url: "{{baseUrl}}/api/pagos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id_pedido": {{orderId}},
      "metodo": "PSE",
      "valor": {{orderTotal}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 201', () => pm.response.to.have.status(201));
      if (pm.response.code === 201) pm.environment.set('paymentId', pm.response.json().datos.id_pago);
    language: text/javascript
order: 2000
