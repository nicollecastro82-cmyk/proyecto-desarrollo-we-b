$kind: http-request
url: "{{baseUrl}}/api/pagos/{{paymentId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "estado": "APROBADO",
      "id_usuario_confirma": {{userId}},
      "referencia_transaccion": "PSE-POSTMAN-001"
    }
scripts:
  - type: afterResponse
    code: pm.test('Estado 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
