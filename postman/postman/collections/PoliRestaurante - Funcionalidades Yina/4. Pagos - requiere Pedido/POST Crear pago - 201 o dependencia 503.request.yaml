$kind: http-request
url: "{{baseUrl}}/api/pagos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id_pedido": {{orderId}},
      "metodo": "PSE",
      "valor": 25000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 al integrar Pedido o 503 mientras falta', () => pm.expect([201, 503]).to.include(pm.response.code));
      if (pm.response.code === 201) pm.environment.set('paymentId', pm.response.json().datos.id_pago);
    language: text/javascript
order: 2000
