$kind: http-request
url: "{{baseUrl}}/api/categorias/{{categoryId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "activo": true
    }
scripts:
  - type: afterResponse
    code: pm.test('Estado 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
