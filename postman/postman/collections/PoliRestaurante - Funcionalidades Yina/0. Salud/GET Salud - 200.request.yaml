$kind: http-request
url: "{{baseUrl}}/api/salud"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Estado 200', () => pm.response.to.have.status(200));
      pm.test('Base conectada', () => pm.expect(pm.response.json().base_datos).to.eql('conectada'));
    language: text/javascript
order: 1000
